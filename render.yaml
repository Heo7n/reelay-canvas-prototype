services:
  - type: web
    name: reelay-canvas-preview
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:preview
    startCommand: npm run start:preview
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      - key: REELAY_DEPLOYMENT_MODE
        value: preview
      - key: REELAY_STORAGE
        value: postgresql
      - key: ALLOW_DEMO_SEED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: reelay-preview-db
          property: connectionString

databases:
  - name: reelay-preview-db
    plan: free
    region: singapore
    databaseName: reelay
    user: reelay
    ipAllowList: []
