<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reelay Canvas</title>
    <link id="appFavicon" rel="icon" type="image/png" href="./assets/reelay-logo.png" />
    <link rel="stylesheet" href="./styles.css?v=20260901-platform-space-27" />
    <link rel="stylesheet" href="./styles/canvas-connections.css?v=20260827-connection-confirm-46" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <div class="project-nav canvas-project-switcher" data-project-nav="top">
          <button class="project-home-button" id="canvasHomeBtn" type="button" data-canvas-home-button title="返回主页" aria-label="返回主页">
            <i class="project-home-icon" data-lucide="chevron-right" aria-hidden="true"></i>
          </button>
          <span class="project-nav-divider" aria-hidden="true"></span>
          <span class="project-nav-name" data-project-name tabindex="0" title="双击或按 Enter 重命名项目" aria-label="项目名称 Untitled，按 Enter 重命名">Untitled</span>
          <button class="project-switch-button" type="button" data-project-menu-button title="项目菜单" aria-label="项目菜单" aria-controls="projectMenu" aria-expanded="false" aria-haspopup="dialog">
            <i data-lucide="chevron-down" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <div class="canvas-access-status" id="canvasAccessStatus" role="status" aria-live="polite" hidden></div>

      <aside class="left-rail" aria-label="画布快捷操作">
        <div class="left-rail-stack top-actions" id="topActions">
          <span class="sr-only" data-canvas-name>画布 1</span>
          <button class="rail-button canvas-switch-trigger" type="button" data-canvas-menu-button aria-label="切换画布" aria-controls="canvasMenu" aria-expanded="false" aria-haspopup="menu">
            <i data-lucide="layers-3" aria-hidden="true"></i>
            <span class="rail-button-tip">切换画布</span>
          </button>
          <button class="rail-button asset-library-trigger" id="railLibraryBtn" type="button" aria-label="资产库" aria-expanded="false">
            <i data-lucide="folder" aria-hidden="true"></i>
            <span class="asset-lib-tooltip rail-button-tip">资产库</span>
          </button>
          <button class="rail-button" id="shareProjectBtn" type="button" aria-label="分享项目">
            <i data-lucide="share-2" aria-hidden="true"></i>
            <span class="rail-button-tip">分享项目</span>
          </button>
          <div class="profile-anchor">
            <button class="rail-button avatar-button" id="railProfileBtn" type="button" data-initial="R" aria-label="个人：Reelay 用户" aria-controls="profileMenu" aria-expanded="false"></button>
            <span class="rail-button-tip profile-button-tip">个人</span>

            <div class="profile-menu hidden" id="profileMenu">
              <div class="profile-card">
                <div class="profile-avatar" id="profileAvatar">R</div>
                <div>
                  <div class="profile-name" id="profileName">Reelay 用户</div>
                  <div class="profile-email" id="profileEmail">演示画布</div>
                </div>
              </div>
              <div class="profile-menu-list">
                <button class="profile-menu-item profile-credit-item" id="profileCreditsBtn" type="button" data-profile-action="credits" aria-label="查看我的积分，当前 3,000">
                  <img class="credit-semantic-icon" src="./assets/icons/credit-prism.svg" alt="" aria-hidden="true" />
                  <span>我的积分</span>
                  <strong class="profile-credit-value" id="profileCreditValue">3,000</strong>
                  <i data-lucide="chevron-right" aria-hidden="true"></i>
                </button>
                <button class="profile-menu-item profile-membership" id="profileOrganization" type="button" data-profile-action="organization" aria-label="进入组织中心">
                  <i data-lucide="building-2" aria-hidden="true"></i>
                  <span>组织中心</span>
                  <small id="profileOrganizationRole">成员</small>
                  <i data-lucide="chevron-right" aria-hidden="true"></i>
                </button>
                <button class="profile-menu-item profile-appearance-item" type="button" data-profile-action="appearance" aria-label="切换外观">
                  <span class="theme-current-icon" id="themeModeIcon">
                    <i data-lucide="moon" aria-hidden="true"></i>
                  </span>
                  <span id="themeCurrentLabel">深色模式</span>
                  <span class="theme-inline-switch" data-theme-inline-switch aria-hidden="true" style="--theme-index: 1">
                    <span class="theme-inline-thumb" aria-hidden="true"></span>
                    <span class="theme-feedback-icon theme-feedback-light" aria-hidden="true">
                      <i data-lucide="sun" aria-hidden="true"></i>
                    </span>
                    <span class="theme-feedback-icon theme-feedback-dark" aria-hidden="true">
                      <i data-lucide="moon" aria-hidden="true"></i>
                    </span>
                  </span>
                </button>
                <button class="profile-menu-item" type="button" data-profile-action="account">
                  <i data-lucide="settings" aria-hidden="true"></i>
                  <span>账号设置</span>
                </button>
                <div class="profile-help-flyout">
                  <button class="profile-menu-item profile-help-trigger" id="profileHelpTrigger" type="button" aria-label="帮助中心" aria-expanded="false" aria-controls="profileHelpPanel">
                    <i data-lucide="circle-help" aria-hidden="true"></i>
                    <span>帮助中心</span>
                    <i data-lucide="chevron-right" aria-hidden="true"></i>
                  </button>
                  <div class="profile-help-flyout-panel" id="profileHelpPanel" role="group" aria-labelledby="profileHelpTrigger">
                    <a class="profile-help-link" href="https://reelay.tech.jetsentv.com/manual" target="_blank" rel="noopener noreferrer">
                      <i data-lucide="book-open-check" aria-hidden="true"></i>
                      <span>使用教程</span>
                    </a>
                    <a class="profile-help-link" href="https://ycndvyll62ov.feishu.cn/share/base/form/shrcnCSKgzknYF8PZuoMdw8uLGd" target="_blank" rel="noopener noreferrer">
                      <i data-lucide="send-horizontal" aria-hidden="true"></i>
                      <span>反馈问题</span>
                    </a>
                    <button class="profile-help-link profile-help-shortcuts" id="profileShortcutTrigger" type="button" aria-expanded="false" aria-controls="profileShortcutSheet">
                      <i data-lucide="keyboard" aria-hidden="true"></i>
                      <span>快捷键</span>
                      <i data-lucide="chevron-down" aria-hidden="true"></i>
                    </button>
                  </div>
                  <div class="profile-shortcut-sheet" id="profileShortcutSheet" role="region" aria-label="快捷键">
                      <div class="profile-shortcut-groups">
                        <section class="profile-shortcut-group">
                          <h3>画布操作</h3>
                          <dl class="profile-shortcut-list">
                            <div class="profile-shortcut-row">
                              <dt>移动视图</dt>
                              <dd><span class="profile-shortcut-key">中键拖动</span><span class="profile-shortcut-separator">/</span><span class="profile-shortcut-key">空格 + 拖动</span></dd>
                            </div>
                            <div class="profile-shortcut-row">
                              <dt>缩放视图</dt>
                              <dd><span class="profile-shortcut-key">Ctrl / Cmd + 滚轮</span></dd>
                            </div>
                            <div class="profile-shortcut-row">
                              <dt>滚动平移</dt>
                              <dd><span class="profile-shortcut-key">Shift + 滚轮</span></dd>
                            </div>
                            <div class="profile-shortcut-row">
                              <dt>多选 / 框选</dt>
                              <dd><span class="profile-shortcut-key">拖动空白</span><span class="profile-shortcut-separator">/</span><span class="profile-shortcut-key">Shift + 单击</span></dd>
                            </div>
                          </dl>
                        </section>
                        <section class="profile-shortcut-group">
                          <h3>节点操作</h3>
                          <dl class="profile-shortcut-list">
                            <div class="profile-shortcut-row">
                              <dt>添加节点</dt>
                              <dd><span class="profile-shortcut-key">双击空白</span></dd>
                            </div>
                            <div class="profile-shortcut-row">
                              <dt>删除节点</dt>
                              <dd><span class="profile-shortcut-key">Delete</span><span class="profile-shortcut-separator">/</span><span class="profile-shortcut-key">Backspace</span></dd>
                            </div>
                            <div class="profile-shortcut-row">
                              <dt>复制并拖动</dt>
                              <dd><span class="profile-shortcut-key">Alt + 拖动</span></dd>
                            </div>
                            <div class="profile-shortcut-row">
                              <dt>撤销上一步</dt>
                              <dd><span class="profile-shortcut-key">Ctrl / Cmd + Z</span></dd>
                            </div>
                            <div class="profile-shortcut-row">
                              <dt>关闭当前浮层</dt>
                              <dd><span class="profile-shortcut-key">Esc</span></dd>
                            </div>
                          </dl>
                        </section>
                      </div>
                  </div>
                </div>
                <button class="profile-menu-item" type="button" data-profile-action="logout">
                  <i data-lucide="log-out" aria-hidden="true"></i>
                  <span>退出账号</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </aside>
      <aside class="asset-library-panel hidden" id="assetLibraryPanel" aria-label="资产库" aria-hidden="true" inert>
        <header class="asset-library-header">
          <div class="asset-library-heading">
            <button class="asset-library-close" id="assetLibraryCloseBtn" type="button" title="返回画布" aria-label="返回画布">
              <i data-lucide="chevron-left" aria-hidden="true"></i>
            </button>
            <h2>资产库</h2>
          </div>
          <div class="asset-library-space-switcher">
            <button class="asset-library-space-button" id="assetLibrarySpaceButton" type="button" aria-haspopup="menu" aria-controls="assetLibrarySpaceMenu" aria-expanded="false">
              <span id="assetLibrarySpaceLabel">个人空间</span>
              <i data-lucide="chevron-down" aria-hidden="true"></i>
            </button>
            <div class="asset-library-space-menu hidden" id="assetLibrarySpaceMenu" role="menu" aria-label="切换资产空间">
              <button type="button" role="menuitemradio" data-library-space="personal" aria-checked="true">
                <i data-lucide="user-round" aria-hidden="true"></i>
                <span>个人空间</span>
                <i class="asset-space-check" data-lucide="check" aria-hidden="true"></i>
              </button>
              <button type="button" role="menuitemradio" data-library-space="organization" aria-checked="false">
                <i data-lucide="users-round" aria-hidden="true"></i>
                <span>组织空间</span>
                <i class="asset-space-check" data-lucide="check" aria-hidden="true"></i>
              </button>
              <button type="button" role="menuitemradio" data-library-space="platform" aria-checked="false">
                <i data-lucide="badge-check" aria-hidden="true"></i>
                <span>平台空间</span>
                <i class="asset-space-check" data-lucide="check" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </header>
        <nav class="asset-library-section-tabs" id="assetLibrarySectionTabs" role="tablist" aria-label="资产类型">
          <button class="active" id="assetLibraryMediaTab" type="button" role="tab" data-library-section="media" aria-selected="true" aria-controls="assetLibraryGrid">素材</button>
          <button id="assetLibraryEntityTab" type="button" role="tab" data-library-section="entity" aria-selected="false" aria-controls="assetLibraryGrid">主体库</button>
        </nav>
        <div class="asset-library-search-row">
          <label class="asset-library-search" aria-label="搜索资产库">
            <i data-lucide="search" aria-hidden="true"></i>
            <input id="assetLibrarySearchInput" type="search" placeholder="搜索" autocomplete="off" />
          </label>
          <div class="asset-library-platform-command-anchor" id="assetLibraryPlatformCommandAnchor"></div>
        </div>
        <div class="asset-library-body">
          <section class="asset-library-content">
            <div class="asset-library-directorybar">
              <div class="asset-library-directory-shell">
                <div class="asset-library-directory">
                  <button class="asset-library-directory-button" id="assetLibraryDirectoryButton" type="button" aria-haspopup="tree" aria-controls="assetLibraryDirectoryTreePopover" aria-expanded="false">
                    <i data-lucide="chevron-down" aria-hidden="true"></i>
                    <strong id="assetLibraryDirectoryName">默认目录</strong>
                  </button>
                  <span class="asset-library-directory-divider" aria-hidden="true"></span>
                  <button class="asset-library-folder-create" id="assetLibraryCreateFolderBtn" type="button" title="在当前目录中新建文件夹" aria-label="在当前目录中新建文件夹">
                    <i data-lucide="plus" aria-hidden="true"></i>
                  </button>
                </div>
                <div class="asset-library-directory-tree-popover hidden" id="assetLibraryDirectoryTreePopover"></div>
              </div>
              <div class="asset-library-command-slot" id="assetLibraryCommandBar"></div>
            </div>
            <div class="asset-library-grid" id="assetLibraryGrid" role="tabpanel" aria-labelledby="assetLibraryMediaTab"></div>
          </section>
        </div>
        <footer class="asset-library-footer">
          <span class="asset-library-count" id="assetLibraryCount">共 0 个素材</span>
        </footer>
        <div class="asset-library-overlay-layer" id="assetLibraryOverlayLayer"></div>
        <input id="assetLibraryUploadInput" type="file" accept="image/*,video/*,audio/*" multiple hidden />
        <div class="asset-library-resize-handle" id="assetLibraryResizeHandle" role="separator" aria-orientation="vertical" aria-label="调整资产库宽度" aria-valuemin="380" aria-valuemax="780" aria-valuenow="550" tabindex="0" title="调整资产库宽度"></div>
      </aside>
      <div id="canvasEntityEditorHost" hidden inert aria-hidden="true"></div>
      <div id="canvasEntityPickerHost" hidden inert aria-hidden="true"></div>
      <input id="canvasEntityEditorUploadInput" type="file" accept="image/*,video/*,audio/*" multiple hidden />
      <dialog class="asset-library-preview-dialog" id="assetLibraryPreviewDialog" aria-labelledby="assetLibraryPreviewTitle">
        <div class="asset-library-preview-shell">
          <header>
            <div>
              <span class="asset-library-preview-kicker" id="assetLibraryPreviewKicker">素材预览</span>
              <h2 id="assetLibraryPreviewTitle">素材</h2>
            </div>
            <button type="button" data-library-preview-close title="关闭预览" aria-label="关闭预览">
              <i data-lucide="x" aria-hidden="true"></i>
            </button>
          </header>
          <div class="asset-library-preview-body" id="assetLibraryPreviewBody"></div>
          <footer>
            <span id="assetLibraryPreviewMeta"></span>
            <button class="asset-library-preview-use" id="assetLibraryPreviewUse" type="button">
              <i data-lucide="plus" aria-hidden="true"></i>
              <span>添加到画布</span>
            </button>
          </footer>
        </div>
      </dialog>
      <div class="project-menu hidden" id="projectMenu" role="dialog" aria-labelledby="projectMenuTitle">
        <h2 class="sr-only" id="projectMenuTitle">切换项目</h2>
        <label class="project-menu-search">
          <i data-lucide="search" aria-hidden="true"></i>
          <span class="sr-only">搜索项目</span>
          <input id="projectMenuSearch" type="search" maxlength="80" placeholder="搜索项目" autocomplete="off" spellcheck="false" />
        </label>
        <div class="project-menu-list" id="projectMenuList" role="list" aria-label="可切换项目"></div>
        <p class="project-menu-empty" id="projectMenuEmpty" hidden>没有找到匹配的项目</p>
        <div class="project-menu-footer">
          <button class="project-menu-create" type="button" data-project-action="create">
            <i data-lucide="plus" aria-hidden="true"></i>
            <span>新建项目</span>
          </button>
        </div>
      </div>

      <div class="canvas-menu hidden" id="canvasMenu" role="menu" aria-label="内部画布菜单">
        <div class="canvas-menu-title" role="none">
          <span>画布</span>
          <button type="button" role="menuitem" data-canvas-action="add" data-canvas-mutation title="添加画布" aria-label="添加画布">
            <i data-lucide="plus" aria-hidden="true"></i>
          </button>
        </div>
        <div class="canvas-menu-list" id="canvasMenuList" role="none"></div>
      </div>

      <div class="canvas-more-menu hidden" id="canvasMoreMenu" role="menu" aria-label="画布操作">
        <button type="button" role="menuitem" data-canvas-more-action="open">在新窗口打开</button>
        <button type="button" role="menuitem" data-canvas-more-action="rename" data-canvas-mutation>重命名画布</button>
        <button type="button" role="menuitem" data-canvas-more-action="duplicate" data-canvas-mutation>复制画布</button>
        <button class="danger" type="button" role="menuitem" data-canvas-more-action="delete" data-canvas-mutation>删除画布</button>
      </div>

      <section class="canvas-shell" id="canvasShell">
        <div class="canvas-grid" id="canvasGrid" aria-hidden="true"></div>
        <div class="multi-selection-surface hidden" id="multiSelectionSurface" aria-hidden="true"></div>
        <div class="canvas-stage" id="canvasStage">
          <svg class="connection-layer" id="connectionLayer" aria-hidden="true">
            <g id="connectionPaths"></g>
            <g id="batchConnectionPreviewPaths"></g>
            <path class="connection-preview hidden" id="connectionPreview"></path>
            <circle class="connection-preview-endpoint hidden" id="connectionPreviewEndpoint" r="4"></circle>
          </svg>
          <div class="node-layer" id="nodeLayer"></div>
        </div>
        <div class="connection-target-glow" id="connectionTargetGlow" aria-hidden="true"></div>
        <div class="connection-create-menu hidden" id="connectionCreateMenu" role="menu" aria-label="创建下游节点" tabindex="-1">
          <span class="connection-create-label">创建下游节点</span>
          <button type="button" role="menuitem" data-connection-create="image" data-canvas-mutation>
            <span class="node-create-icon"><i data-lucide="image" aria-hidden="true"></i></span>
            <span class="node-create-copy">
              <span class="node-create-title">图片</span>
              <span class="node-create-description">添加图片生成节点</span>
            </span>
          </button>
          <button type="button" role="menuitem" data-connection-create="video" data-canvas-mutation>
            <span class="node-create-icon"><i data-lucide="square-play" aria-hidden="true"></i></span>
            <span class="node-create-copy">
              <span class="node-create-title">视频</span>
              <span class="node-create-description">添加视频生成节点</span>
            </span>
          </button>
        </div>
        <div class="node-create-menu hidden" id="nodeCreateMenu" role="menu" aria-label="添加节点" tabindex="-1">
          <button type="button" role="menuitem" data-node-create="image" data-canvas-mutation>
            <span class="node-create-icon"><i data-lucide="image" aria-hidden="true"></i></span>
            <span class="node-create-copy">
              <span class="node-create-title">图片</span>
              <span class="node-create-description">添加图片生成节点</span>
            </span>
          </button>
          <button type="button" role="menuitem" data-node-create="video" data-canvas-mutation>
            <span class="node-create-icon"><i data-lucide="square-play" aria-hidden="true"></i></span>
            <span class="node-create-copy">
              <span class="node-create-title">视频</span>
              <span class="node-create-description">添加视频生成节点</span>
            </span>
          </button>
          <button type="button" role="menuitem" data-node-create="upload" data-canvas-mutation>
            <span class="node-create-icon"><i data-lucide="upload" aria-hidden="true"></i></span>
            <span class="node-create-copy">
              <span class="node-create-title">上传</span>
              <span class="node-create-description">支持图片、视频、音频文件</span>
            </span>
          </button>
        </div>
        <div class="selection-box hidden" id="selectionBox"></div>
        <div class="group-resize-overlay hidden" id="groupResizeOverlay" role="group" aria-label="组框缩放控制">
          <button class="group-corner-handle north-east" type="button" data-group-resize="ne" aria-label="从右上角调整组框大小"></button>
          <button class="group-corner-handle south-east" type="button" data-group-resize="se" aria-label="从右下角调整组框大小"></button>
          <button class="group-corner-handle south-west" type="button" data-group-resize="sw" aria-label="从左下角调整组框大小"></button>
          <button class="group-corner-handle north-west" type="button" data-group-resize="nw" aria-label="从左上角调整组框大小"></button>
        </div>
        <div class="multi-selection-chrome hidden" id="multiSelectionChrome">
          <button
            class="multi-selection-port"
            id="multiSelectionPort"
            type="button"
            data-selection-connect-output
            data-canvas-mutation
            aria-label="连接所有选中节点到共同下游"
          >
            <span class="multi-selection-port-mark" aria-hidden="true"></span>
          </button>
        </div>
        <div class="selection-toolbar hidden" id="selectionToolbar" role="toolbar" aria-label="多选节点操作">
          <button class="icon-toolbar-button text-button selection-toolbar-group" type="button" data-selection-action="group" data-canvas-mutation aria-label="打组">
            <i data-lucide="combine" aria-hidden="true"></i>
            <span>打组</span>
            <span class="toolbar-tip">打组</span>
          </button>
          <button class="icon-toolbar-button text-button" type="button" data-selection-action="add-library" data-canvas-mutation aria-label="保存到素材">
            <i data-lucide="folder-plus" aria-hidden="true"></i>
            <span>保存到素材</span>
            <span class="toolbar-tip">保存到项目素材</span>
          </button>
          <div class="toolbar-menu-wrap selection-download-control" data-toolbar-menu="download">
            <button class="icon-toolbar-button text-button selection-download-trigger" type="button" data-selection-action="toggle-download" aria-label="下载" aria-haspopup="menu" aria-expanded="false">
              <i data-lucide="download" aria-hidden="true"></i>
              <span>下载</span>
              <i class="selection-download-chevron" data-lucide="chevron-down" aria-hidden="true"></i>
              <span class="toolbar-tip">下载选项</span>
            </button>
            <div class="toolbar-dropdown hidden toolbar-dropdown-right" id="selectionDownloadMenu" role="menu">
              <button type="button" data-download-action="batch"><i data-lucide="download" aria-hidden="true"></i><span>批量下载</span></button>
              <button type="button" data-download-action="archive"><i data-lucide="archive" aria-hidden="true"></i><span>打包下载</span></button>
            </div>
          </div>
        </div>
        <div class="empty-state" id="emptyState">
          <div class="empty-create" aria-hidden="true">
            <span class="empty-create-prompt">
              <span class="empty-create-icon">
                <img class="empty-create-glyph" src="./assets/canvas-empty-cursor.png" alt="" />
              </span>
              <span class="empty-create-copy">
                <span class="empty-create-main">双击画布</span>
                <span class="empty-create-secondary">开始自由创作</span>
              </span>
            </span>
          </div>
        </div>
        <div class="canvas-tools" id="canvasTools">
          <div class="canvas-tool-popover minimap-popover hidden" id="minimapPanel" data-canvas-popover="minimap">
            <div class="minimap-surface" id="minimapSurface" aria-label="画布小地图"></div>
          </div>
          <div class="canvas-tool-row">
            <button class="canvas-tool-button" type="button" data-canvas-tool="minimap" aria-label="小地图">
              <i data-lucide="map" aria-hidden="true"></i>
              <span class="canvas-tool-tip">小地图</span>
            </button>
            <button class="canvas-tool-button" type="button" data-canvas-tool="fit" aria-label="适应视图">
              <i data-lucide="scan" aria-hidden="true"></i>
              <span class="canvas-tool-tip">适应视图</span>
            </button>
            <button class="canvas-tool-button canvas-tool-button-upcoming" type="button" data-canvas-tool="organize" aria-label="整理画布，即将支持" aria-disabled="true" disabled>
              <i data-lucide="layout-grid" aria-hidden="true"></i>
              <span class="canvas-tool-tip">整理画布 · 即将支持</span>
            </button>
            <label class="canvas-zoom-control" aria-label="放大/缩小画布">
              <input id="zoomSlider" type="range" min="20" max="200" step="1" value="100" aria-label="放大/缩小画布，20% 到 200%" />
              <span class="canvas-zoom-value" id="zoomValueTip" aria-hidden="true">100%</span>
            </label>
          </div>
        </div>
      </section>

      <aside class="agent-dock collapsed" id="agentDock" style="--agent-width: 420px">
        <button class="agent-launcher" id="agentLauncher" type="button" aria-label="展开 Reelay Agent" aria-expanded="false">
          <span class="agent-tooltip">Reelay Agent</span>
          <span class="agent-logo" aria-hidden="true">
            <img src="./assets/reelay-logo.png" alt="" />
          </span>
        </button>

        <section class="agent-panel" id="agentPanel" aria-label="Agent 对话栏" aria-hidden="true" inert>
          <div class="agent-resize-handle" id="agentResizeHandle" aria-hidden="true"></div>
          <header class="agent-header">
            <div class="agent-title" id="agentConversationTitle">新对话</div>
            <div class="agent-actions">
              <div class="agent-new-group" aria-label="对话操作">
                <button class="agent-icon-button new-chat-button" id="agentNewChatBtn" type="button" title="新建对话">
                  <i data-lucide="square-plus" aria-hidden="true"></i>
                </button>
                <button class="agent-icon-button history-toggle-button" id="agentHistoryBtn" type="button" title="历史对话">
                  <i data-lucide="chevron-down" aria-hidden="true"></i>
                </button>
              </div>
              <button class="agent-icon-button close-chat-button" id="agentCloseBtn" type="button" title="关闭聊天">
                <i data-lucide="panel-right-close" aria-hidden="true"></i>
              </button>
            </div>
          </header>

          <div class="agent-history-menu hidden" id="agentHistoryMenu">
            <div class="history-title">历史对话</div>
            <label class="history-search">
              <span aria-hidden="true">⌕</span>
              <input id="agentHistorySearch" type="search" placeholder="请输入搜索关键词" />
            </label>
            <div class="history-section-label">新对话</div>
            <div class="history-list" id="agentHistoryList"></div>
          </div>

          <div class="agent-messages" id="agentMessages"></div>

          <div class="agent-composer">
            <textarea id="agentInput" placeholder='Start with an idea, or type "@" to mention'></textarea>
            <div class="agent-composer-bar">
              <button class="agent-add-button" type="button" title="添加">
                <i data-lucide="plus" aria-hidden="true"></i>
              </button>
              <button class="agent-mode" type="button" title="Agent 模式">
                <i data-lucide="bot" aria-hidden="true"></i>
                <span>Agent</span>
                <i data-lucide="chevron-down" aria-hidden="true"></i>
              </button>
              <div class="agent-composer-spacer"></div>
              <div class="agent-model-wrap">
                <button class="agent-model-button" id="agentModelBtn" type="button" title="模型偏好" aria-label="模型偏好">
                  <i data-lucide="box" aria-hidden="true"></i>
                </button>
                <div class="agent-model-menu hidden" id="agentModelMenu"></div>
              </div>
              <button class="agent-send" type="button" title="发送">
                <i data-lucide="send-horizontal" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </section>
      </aside>

    </main>
