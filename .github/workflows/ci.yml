name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            EMPTY_TREE_SHA="$(git hash-object -t tree /dev/null)"
            git diff --check "$EMPTY_TREE_SHA" "$GITHUB_SHA"
          else
            git diff --check "$PUSH_BEFORE_SHA" "$GITHUB_SHA"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run code checks
        run: npm run check

      - name: Build application shell
        run: npm run build:shell

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://reelay:reelay-local-only@127.0.0.1:5432/postgres

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: reelay
          POSTGRES_USER: reelay
          POSTGRES_PASSWORD: reelay-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reelay -d reelay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL integration checks
        run: npm run check:server:postgres
