<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reelay 登录后创作主页原型" />
    <title>Reelay 立画 · 创作主页</title>
    <link rel="icon" type="image/png" href="./assets/reelay-logo.png" />
    <link rel="stylesheet" href="./styles/home.css" />
  </head>
  <body>
    <div class="home-shell">
      <header class="home-header">
        <a class="home-brand" href="./home.html" aria-label="Reelay 立画主页">
          <span class="home-wordmark-crop" aria-hidden="true">
            <img src="./assets/home/reelay-wordmark.png" alt="" />
          </span>
        </a>

        <div class="home-account" data-account-anchor>
          <button class="home-credit-button" id="homeCreditButton" type="button" aria-label="可用积分 3000" aria-expanded="false" aria-controls="homeProfileMenu">
            <i data-lucide="sparkles" aria-hidden="true"></i>
            <span>3000</span>
          </button>
          <button class="home-avatar-button" id="homeProfileButton" type="button" aria-label="打开账户菜单" aria-expanded="false" aria-controls="homeProfileMenu">T</button>

          <div class="home-profile-menu" id="homeProfileMenu" hidden>
            <div class="home-profile-identity">
              <span class="home-profile-avatar" aria-hidden="true">T</span>
              <span>
                <strong>Tianmaochao</strong>
                <small>t***@reelay.test</small>
              </span>
            </div>
            <div class="home-credit-summary" id="homeCreditSummary" hidden>
              <span>可用积分</span>
              <strong>3000</strong>
              <small>累计消耗 0 积分</small>
            </div>
            <div class="home-profile-section">
              <span class="home-profile-label">工作空间</span>
              <button class="home-profile-item is-current" type="button" data-workspace="personal">
                <i data-lucide="user-round" aria-hidden="true"></i>
                <span>个人空间</span>
                <small>当前</small>
              </button>
              <button class="home-profile-item" type="button" data-workspace="organization">
                <i data-lucide="building-2" aria-hidden="true"></i>
                <span>Reelay Studio</span>
                <small>组织演示</small>
              </button>
            </div>
            <div class="home-profile-divider" aria-hidden="true"></div>
            <button class="home-profile-item" type="button" data-profile-action="theme">
              <i data-lucide="moon" aria-hidden="true" id="homeThemeIcon"></i>
              <span id="homeThemeLabel">深色模式</span>
            </button>
            <a class="home-profile-item" href="./index.html">
              <i data-lucide="panels-top-left" aria-hidden="true"></i>
              <span>进入画布</span>
            </a>
            <a class="home-profile-item home-profile-signout" href="./login.html">
              <i data-lucide="log-out" aria-hidden="true"></i>
              <span>退出演示账号</span>
            </a>
          </div>
        </div>
      </header>

      <main class="home-main" id="homeMain">
        <h1 class="sr-only">Reelay 创作主页</h1>

        <section class="hero-carousel" aria-label="Reelay 创作能力">
          <button class="carousel-arrow carousel-arrow-left" type="button" data-carousel-direction="-1" aria-label="上一项">
            <i data-lucide="chevron-left" aria-hidden="true"></i>
          </button>
          <div class="hero-track" id="heroTrack" aria-live="polite"></div>
          <button class="carousel-arrow carousel-arrow-right" type="button" data-carousel-direction="1" aria-label="下一项">
            <i data-lucide="chevron-right" aria-hidden="true"></i>
          </button>
          <div class="carousel-dots" id="carouselDots" aria-label="选择轮播内容"></div>
        </section>

        <section class="creation-start" aria-label="开始创作">
          <form class="creation-composer" id="creationComposer">
            <label class="sr-only" for="creationPrompt">描述你的创作需求</label>
            <textarea id="creationPrompt" rows="2" maxlength="600" placeholder="输入你的创作需求，或选择下方能力开始"></textarea>
            <div class="composer-toolbar">
              <div class="composer-tools" aria-label="添加创作输入">
                <button type="button" data-composer-action="add" aria-label="添加素材"><i data-lucide="plus" aria-hidden="true"></i></button>
                <button type="button" data-composer-action="template" aria-label="从模板开始"><i data-lucide="box" aria-hidden="true"></i></button>
                <button type="button" data-composer-action="image" aria-label="添加图片"><i data-lucide="image" aria-hidden="true"></i></button>
                <button type="button" data-composer-action="agent" aria-label="使用 Reelay Agent"><i data-lucide="sparkles" aria-hidden="true"></i></button>
              </div>
              <button class="composer-submit" type="submit" aria-label="带着创作需求进入画布" disabled>
                <i data-lucide="arrow-up" aria-hidden="true"></i>
              </button>
            </div>
          </form>
          <div class="capability-strip" id="capabilityStrip" aria-label="创作能力"></div>
        </section>

        <section class="recent-projects" id="recent-projects" aria-labelledby="recentProjectsTitle">
          <div class="section-heading">
            <div>
              <h2 id="recentProjectsTitle">最近项目</h2>
            </div>
            <a href="#all-projects" id="allProjectsTrigger" aria-controls="allProjectsView" aria-expanded="false">全部项目 <i data-lucide="chevron-right" aria-hidden="true"></i></a>
          </div>
          <div class="project-grid" id="projectGrid"></div>
        </section>
      </main>

      <main class="all-projects-view" id="allProjectsView" aria-labelledby="allProjectsTitle" aria-hidden="true" inert hidden>
        <div class="all-projects-inner">
          <div class="all-projects-heading">
            <button class="projects-back-button" id="allProjectsBack" type="button">
              <i data-lucide="arrow-left" aria-hidden="true"></i>
              <span>返回</span>
            </button>
            <h2 id="allProjectsTitle" tabindex="-1">全部项目</h2>
          </div>

          <div class="all-projects-controls">
            <div class="project-scope-switch" aria-label="项目类型筛选">
              <button type="button" data-project-scope="personal" aria-pressed="true">个人</button>
              <button type="button" data-project-scope="organization" aria-pressed="false">协作项目</button>
            </div>

            <label class="projects-search" for="projectsSearchInput">
              <i data-lucide="search" aria-hidden="true"></i>
              <span class="sr-only">搜索项目</span>
              <input id="projectsSearchInput" type="search" maxlength="80" placeholder="搜索项目" autocomplete="off" />
            </label>
          </div>

          <div class="sr-only" id="projectsResultSummary" aria-live="polite"></div>
          <div class="all-projects-grid" id="allProjectsGrid"></div>
        </div>
      </main>

      <div class="project-context-menu" id="projectContextMenu" role="menu" aria-label="项目操作" hidden>
        <a id="projectMenuOpen" href="./index.html" role="menuitem">打开</a>
        <button type="button" role="menuitem" data-project-action="rename">重命名</button>
        <button type="button" role="menuitem" data-project-action="cover">修改封面</button>
        <button type="button" role="menuitem" data-project-action="collaborate">转为协作项目</button>
        <button class="is-danger" type="button" role="menuitem" data-project-action="delete">删除项目</button>
      </div>

      <div class="home-toast" id="homeToast" role="status" aria-live="polite" hidden></div>
    </div>

    <script src="./vendor/lucide-1.25.0.min.js"></script>
    <script src="./src/config/home-prototype-config.js"></script>
    <script src="./src/home/index.js"></script>
  </body>
</html>
