<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reelay 账户密码登录流程原型" />
    <title>Reelay 立画 · 登录</title>
    <link rel="icon" type="image/png" href="./assets/reelay-logo.png" />
    <link rel="stylesheet" href="./styles/login.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-visual" aria-label="Reelay AI 视频创作空间">
        <img class="login-visual-image" src="./assets/auth/login-studio.webp" alt="" />
        <span class="login-visual-shade" aria-hidden="true"></span>
        <a class="login-brand" href="./login.html" aria-label="Reelay 立画登录页">
          <span class="login-wordmark-crop" aria-hidden="true">
            <img src="./assets/home/reelay-wordmark.png" alt="" />
          </span>
        </a>
      </section>

      <section class="login-form-panel" aria-labelledby="loginTitle">
        <button class="login-close" type="button" aria-label="关闭登录页" data-prototype-message="营销首页将在后续开放。">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>

        <div class="login-form-wrap">
          <h1 id="loginTitle">登录或注册</h1>

          <form class="login-form" id="loginForm" novalidate>
            <label for="loginAccount">账号</label>
            <input id="loginAccount" name="account" type="text" value="tianmaochao@reelay.test" placeholder="请输入账号" autocomplete="username" spellcheck="false" required />

            <label for="loginPassword">密码</label>
            <div class="password-field">
              <input id="loginPassword" name="password" type="password" value="reelay-demo" placeholder="请输入密码" autocomplete="current-password" required />
              <button id="togglePassword" type="button" aria-label="显示密码" aria-pressed="false">
                <i data-lucide="eye" aria-hidden="true"></i>
              </button>
            </div>

            <button class="login-text-action login-forgot" type="button" data-prototype-message="忘记密码流程将在正式账户系统阶段接入。">忘记密码？</button>

            <p class="login-error" id="loginError" role="alert" hidden></p>

            <button class="login-submit" id="loginSubmit" type="submit">
              <span>登录</span>
            </button>
          </form>

          <div class="login-divider" aria-hidden="true"><span>或</span></div>

          <button class="login-google" id="googleLogin" type="button">
            <span class="google-mark" aria-hidden="true">G</span>
            <span>使用 Google 继续</span>
          </button>

          <p class="login-agreement">
            继续即表示你同意
            <button type="button" data-prototype-message="用户协议页面将在正式应用壳中提供。">用户协议</button>
            与
            <button type="button" data-prototype-message="隐私政策页面将在正式应用壳中提供。">隐私政策</button>
          </p>

          <p class="login-register">
            还没有账号？
            <button type="button" data-prototype-message="注册流程将在正式账户系统阶段接入。">立即注册</button>
          </p>
        </div>

        <div class="login-notice" id="loginNotice" role="status" aria-live="polite"></div>
      </section>
    </main>

    <script src="./vendor/lucide-1.25.0.min.js"></script>
    <script src="./src/login/index.js"></script>
  </body>
</html>
